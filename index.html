<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube → X シェア</title>
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #0f1419;
    --muted: #5b6672;
    --line: #dfe3e8;
    --accent: #0f1419;
    --accent-text: #ffffff;
    --focus: #1d9bf0;
    --ok: #0a7d46;
    --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --panel: #171b22;
      --text: #e7e9ea;
      --muted: #8b98a5;
      --line: #2a313b;
      --accent: #eff3f4;
      --accent-text: #0f1419;
      --ok: #4cc38a;
      --err: #ff7b72;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .url-row { display: flex; gap: 8px; }
  .url-row .url-input { flex: 1; min-width: 0; }
  .url-row button { flex: none; border-radius: 12px; background: var(--panel); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 16px 64px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .lead {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .url-input {
    width: 100%;
    padding: 14px 16px;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 12px;
    outline: none;
  }
  .url-input:focus { border-color: var(--focus); }
  .status {
    min-height: 24px;
    margin: 8px 2px 0;
    font-size: 13px;
    color: var(--muted);
  }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }

  .result {
    margin-top: 16px;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  .result[hidden] { display: none; }
  .label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .count.over { color: var(--err); font-weight: 600; }
  textarea {
    display: block;
    width: 100%;
    min-height: 128px;
    padding: 10px 12px;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: var(--focus); }
  .thumb {
    display: block;
    width: 100%;
    margin-top: 12px;
    border-radius: 14px;
    border: 1px solid var(--line);
    height: auto;
  }
  .thumb-meta {
    margin: 6px 2px 0;
    font-size: 12px;
    color: var(--muted);
  }
  .image-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .image-tools button { font-size: 13px; padding: 6px 12px; }
  .image-hint { font-size: 12px; color: var(--muted); }
  .choices {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-top: 10px;
  }
  .choices .choice {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 0;
    border: 2px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }
  .choices .choice canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; }
  .choices .choice span { padding: 3px 2px 4px; font-size: 11px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .choices .choice[aria-pressed="true"] { border-color: var(--focus); color: var(--text); font-weight: 700; }
  .caption-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 20px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 13px;
  }
  .caption-tools label { display: inline-flex; align-items: center; gap: 8px; }
  .caption-tools .size { flex: 1 1 240px; }
  .caption-tools input[type="range"] { flex: 1; min-width: 100px; accent-color: var(--focus); }
  .caption-tools input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--focus); }
  .caption-tools output { min-width: 3.2em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  body.dragging .result { outline: 2px dashed var(--focus); outline-offset: 2px; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  button, .btn {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }
  button:hover, .btn:hover { border-color: var(--muted); }
  button:focus-visible, .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button.primary {
    flex: 1 1 100%;
    justify-content: center;
    padding: 12px 16px;
    font-size: 15px;
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  button.primary:hover { opacity: 0.88; }
  button:disabled { opacity: 0.45; cursor: default; }
  .hint {
    margin: 12px 2px 0;
    font-size: 13px;
    color: var(--muted);
  }
  kbd {
    font: inherit;
    font-size: 12px;
    padding: 1px 6px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: var(--bg);
  }
</style>
</head>
<body>
<main>
  <h1>YouTube → X シェア</h1>
  <p class="lead">YouTube か TVer の URL をこのページに貼り付けるだけで、X 用の投稿内容を作ります。</p>

  <div class="url-row">
    <input id="url" class="url-input" type="url" inputmode="url" autocomplete="off" spellcheck="false"
           placeholder="ここに YouTube / TVer の URL を貼り付け（Ctrl+V）" autofocus>
    <button id="pasteBtn" type="button" hidden>貼り付け</button>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>

  <section id="result" class="result" hidden>
    <div class="label">
      <span>投稿テキスト（編集できます）</span>
      <span id="count" class="count"></span>
    </div>
    <textarea id="text" spellcheck="false"></textarea>

    <img id="thumb" class="thumb" alt="サムネイル画像">
    <p id="thumbMeta" class="thumb-meta"></p>

    <div id="choices" class="choices" role="group" aria-label="投稿画像を選ぶ" hidden></div>

    <div class="image-tools">
      <button id="pickImageBtn" type="button">スクショに差し替える</button>
      <button id="revertImage" type="button" hidden>スクショをやめる</button>
      <input id="pickImage" type="file" accept="image/*" hidden>
      <span id="imageHint" class="image-hint">画像の貼り付け（Ctrl+V）やドラッグ＆ドロップでも差し替えられます。</span>
    </div>

    <div id="captionTools" class="caption-tools" hidden>
      <label class="check"><input id="captionShow" type="checkbox" checked> <span id="captionShowLabel">画像の下にタイトル｜チャンネル名を入れる</span></label>
      <label class="size">文字の大きさ
        <input id="captionSize" type="range" min="50" max="300" step="10" value="100">
        <output id="captionSizeOut" for="captionSize">100%</output>
      </label>
    </div>

    <div class="actions">
      <button id="share" type="button" hidden>共有メニューで X に送る（画像つき）</button>
      <button id="post" class="primary" type="button">画像をコピーして X の投稿画面を開く</button>
      <button id="copyText" type="button">テキストをコピー</button>
      <button id="copyImage" type="button">画像をコピー</button>
      <a id="saveImage" class="btn" download>画像を保存</a>
    </div>
    <p id="hintDesktop" class="hint">X の投稿画面が開いたら、入力欄で <kbd>Ctrl</kbd>+<kbd>V</kbd> を押すと画像が添付されます。</p>
    <p id="hintMobile" class="hint" hidden>共有メニューで X を選ぶと、テキストと画像が入った状態で投稿画面が開きます。テキストはクリップボードにもコピーされます。</p>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const urlInput = $('url');
  const statusEl = $('status');
  const resultEl = $('result');
  const textEl = $('text');
  const countEl = $('count');
  const thumbEl = $('thumb');
  const thumbMetaEl = $('thumbMeta');
  const postBtn = $('post');
  const copyTextBtn = $('copyText');
  const copyImageBtn = $('copyImage');
  const saveImageEl = $('saveImage');
  const shareBtn = $('share');
  const pasteBtn = $('pasteBtn');
  const hintDesktopEl = $('hintDesktop');
  const hintMobileEl = $('hintMobile');
  const pickImageBtn = $('pickImageBtn');
  const pickImageInput = $('pickImage');
  const revertBtn = $('revertImage');
  const imageHintEl = $('imageHint');
  const choicesEl = $('choices');
  const captionToolsEl = $('captionTools');
  const captionShowEl = $('captionShow');
  const captionShowLabelEl = $('captionShowLabel');
  const captionSizeEl = $('captionSize');
  const captionSizeOutEl = $('captionSizeOut');

  const X_LIMIT = 280;
  const X_URL_WEIGHT = 23;
  const isMobile = navigator.userAgentData?.mobile ?? /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  let requestSeq = 0;      // 後から貼り付けた URL を優先するための番号
  let lastKey = '';        // 同じ URL での二重生成を防ぐ
  let pngBlob = null;      // クリップボード用（PNG のみ対応のため）
  let shareFile = null;    // スマホの共有メニュー用
  let thumbObjectUrl = '';
  let current = null;      // 表示中の動画（解析結果・番組情報・元のサムネイル）
  let renderSeq = 0;       // 画像の描き直しが重なったとき、最後の 1 回だけ採用する

  function setStatus(message, kind = '') {
    statusEl.textContent = message;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  // --- URL 解析 ---------------------------------------------------------
  function parseYouTubeUrl(raw) {
    const match = String(raw).match(/https?:\/\/[^\s<>"']+/i);
    let candidate = match ? match[0] : String(raw).trim();
    if (!candidate) return null;
    if (!/^https?:\/\//i.test(candidate)) candidate = 'https://' + candidate;

    let u;
    try { u = new URL(candidate); } catch { return null; }

    const host = u.hostname.replace(/^(www|m|music)\./, '').toLowerCase();
    const idPattern = /^[A-Za-z0-9_-]{11}$/;
    let id = '';

    if (host === 'youtu.be') {
      id = u.pathname.split('/')[1] || '';
    } else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      const parts = u.pathname.split('/').filter(Boolean);
      if (parts[0] === 'watch') id = u.searchParams.get('v') || '';
      else if (['shorts', 'live', 'embed', 'v'].includes(parts[0])) id = parts[1] || '';
    } else {
      return null;
    }
    if (!idPattern.test(id)) return null;

    // 再生開始位置（t= / start=）だけ引き継ぎ、追跡用パラメータは落とす
    const t = (u.searchParams.get('t') || u.searchParams.get('start') || '').trim();
    const start = /^(\d+s?|(\d+h)?(\d+m)?(\d+s)?)$/.test(t) && t ? t : '';

    return {
      id,
      shareUrl: 'https://youtu.be/' + id + (start ? '?t=' + encodeURIComponent(start) : ''),
      watchUrl: 'https://www.youtube.com/watch?v=' + id,
    };
  }

  // TVer のエピソード URL（https://tver.jp/episodes/ep…）
  function parseTverUrl(raw) {
    const text = String(raw);
    const m =
      text.match(/(?:^|[\s/.])tver\.jp\/(?:[a-z]+\/)*episodes\/(ep[a-z0-9]{6,})/i) ||
      // アプリの共有などで形が違っても、tver.jp の URL 内にエピソード ID があれば拾う
      text.match(/(?:^|[\s/.])tver\.jp(?:\/[^\s]*?)?[\/=](ep[a-z0-9]{8})(?![a-z0-9])/i);
    if (!m) return null;
    const id = m[1].toLowerCase();
    return { id, shareUrl: 'https://tver.jp/episodes/' + id };
  }

  function parseUrl(raw) {
    const youtube = parseYouTubeUrl(raw);
    if (youtube) return { service: 'youtube', ...youtube };
    const tver = parseTverUrl(raw);
    if (tver) return { service: 'tver', ...tver };
    return null;
  }

  // --- TVer の番組名・タイトル取得（TVer が公開している番組データ） -------
  async function fetchTverInfo(id) {
    const res = await fetch('https://statics.tver.jp/content/episode/' + id + '.json');
    if (!res.ok) throw new Error('TVer HTTP ' + res.status);
    const data = await res.json();
    const title = String(data.title || '').trim();
    // 共有用テキスト（「番組名\n#TVer」）の番組名を使う。シーズン表記も含まれる
    let series = String((data.share && data.share.text) || '')
      .split('\n').map((s) => s.trim()).filter((s) => s && !s.startsWith('#')).join(' ');
    if (!series && data.seriesID) {
      try {
        const sr = await fetch('https://statics.tver.jp/content/series/' + data.seriesID + '.json');
        if (sr.ok) series = String((await sr.json()).title || '').trim();
      } catch { /* 番組名なしで続行 */ }
    }
    return {
      series,
      title,
      seriesID: String(data.seriesID || ''),
      provider: String(data.broadcastProviderLabel || '').trim(), // 例: テレビ朝日
      date: String(data.broadcastDateLabel || '').trim(),         // 例: 3月11日(水)放送分
    };
  }

  // --- タイトル取得（YouTube 公式 oEmbed） ------------------------------
  async function fetchInfo(watchUrl) {
    const res = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(watchUrl));
    if (!res.ok) throw new Error('oEmbed HTTP ' + res.status);
    const data = await res.json();
    return {
      title: String(data.title || '').trim(),
      channel: String(data.author_name || '').trim(),
    };
  }

  // --- サムネイル取得 ---------------------------------------------------
  function canvasToBlob(canvas, type) {
    return new Promise((resolve, reject) => {
      canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob failed'))), type, 0.95);
    });
  }

  // 4:3 のサムネイルに付く上下の黒帯を検出する
  function hasLetterbox(ctx, w, h) {
    const band = Math.round((h - (w * 9) / 16) / 2);
    if (band < 4) return false;
    const isDark = (y0, y1) => {
      const data = ctx.getImageData(0, y0, w, y1 - y0).data;
      let sum = 0;
      for (let i = 0; i < data.length; i += 4) sum += data[i] + data[i + 1] + data[i + 2];
      return sum / ((data.length / 4) * 3) < 14;
    };
    return isDark(0, band - 2) && isDark(h - band + 2, h);
  }

  async function loadCanvas(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const bmp = await createImageBitmap(await res.blob());
    const canvas = document.createElement('canvas');
    canvas.width = bmp.width;
    canvas.height = bmp.height;
    canvas.getContext('2d', { willReadFrequently: true }).drawImage(bmp, 0, 0);
    return canvas;
  }

  // type: 'episode'（その回のサムネイル）か 'series'（番組全体の画像）
  async function fetchTverThumbnail(id, type = 'episode') {
    for (const size of ['xlarge', 'large', 'medium']) {
      try {
        return await loadCanvas('https://statics.tver.jp/images/content/thumbnail/' + type + '/' + size + '/' + id + '.jpg');
      } catch {
        // 次の大きさを試す
      }
    }
    throw new Error('thumbnail unavailable');
  }

  // kind: 'default'（公式サムネイル）か '1'〜'3'（YouTube が自動生成した途中の場面）
  async function fetchThumbnail(id, kind = 'default') {
    const variants = ['maxres' + kind, 'sd' + kind, 'hq' + kind];
    for (const name of variants) {
      try {
        const src = await loadCanvas('https://i.ytimg.com/vi/' + id + '/' + name + '.jpg');
        if (src.width <= 120) continue; // 「画像なし」のダミー
        const sctx = src.getContext('2d');

        let out = src;
        if (hasLetterbox(sctx, src.width, src.height)) {
          const h = Math.round((src.width * 9) / 16);
          out = document.createElement('canvas');
          out.width = src.width;
          out.height = h;
          out.getContext('2d').drawImage(src, 0, Math.round((src.height - h) / 2), src.width, h, 0, 0, src.width, h);
        }
        return out;
      } catch {
        // 次の解像度を試す
      }
    }
    throw new Error('thumbnail unavailable');
  }

  // --- 画像の下に、タイトルなどの文字の欄を付ける -----------------------
  const CAPTION_FONT = '"Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans JP", sans-serif';

  // 幅に収まらないときは末尾を「…」で省略する
  function fitText(ctx, text, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) return text;
    const chars = Array.from(text);
    let lo = 0, hi = chars.length;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      if (ctx.measureText(chars.slice(0, mid).join('') + '…').width <= maxWidth) lo = mid;
      else hi = mid - 1;
    }
    return chars.slice(0, lo).join('').trimEnd() + '…';
  }

  // 幅に収まるよう文字単位で折り返す。maxLines を超える分は最後の行を「…」で省略する
  function wrapText(ctx, text, maxWidth, maxLines) {
    const lines = [];
    let rest = Array.from(text);
    while (rest.length && lines.length < maxLines) {
      if (lines.length === maxLines - 1) {
        lines.push(fitText(ctx, rest.join(''), maxWidth));
        break;
      }
      let n = rest.length;
      if (ctx.measureText(rest.join('')).width > maxWidth) {
        let lo = 1, hi = rest.length;
        while (lo < hi) {
          const mid = Math.ceil((lo + hi) / 2);
          if (ctx.measureText(rest.slice(0, mid).join('')).width <= maxWidth) lo = mid;
          else hi = mid - 1;
        }
        n = lo;
      }
      lines.push(rest.slice(0, n).join('').trimEnd());
      rest = rest.slice(n);
      while (rest.length && /\s/.test(rest[0])) rest.shift();
    }
    return lines;
  }

  // 画像の下に付ける複数行の情報欄。基準の文字サイズは 1280px 幅で 35px × baseScale
  function layoutStack(ctx, w, caption, scale) {
    const base = Math.max(10, Math.max(14, w * 0.0275) * (caption.baseScale || 1) * scale);
    const padX = Math.round(base * 1.25);
    const maxWidth = w - padX * 2;
    const items = [];
    let y = Math.round(base * (caption.padTop ?? 0.8));
    for (const row of caption.rows) {
      if (!row.text) continue;
      const size = Math.max(8, Math.round(base * row.size));
      const font = (row.bold ? 'bold ' : '') + size + 'px ' + CAPTION_FONT;
      const lineHeight = Math.round(size * (caption.lineHeight || 1.4));
      if (items.length) y += Math.round(base * (row.gapBefore || 0));
      ctx.font = font;
      for (const text of wrapText(ctx, row.text, maxWidth, row.maxLines || 1)) {
        items.push({ text, font, color: row.color, y: y + lineHeight / 2 });
        y += lineHeight;
      }
    }
    if (!items.length) return null;
    return {
      height: y + Math.round(base * (caption.padBottom ?? 0.75)),
      draw(c, top) {
        c.textBaseline = 'middle';
        for (const item of items) {
          c.font = item.font;
          c.fillStyle = item.color;
          c.fillText(item.text, padX, top + item.y);
        }
      },
    };
  }

  // caption: null（文字なし）/ {baseScale, lineHeight, padTop, padBottom, rows:[{text, size, bold, color, maxLines, gapBefore}]}
  async function composeImage(thumb, caption, scale = 1) {
    const w = thumb.width;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const block = caption ? layoutStack(ctx, w, caption, scale) : null;
    const band = block ? block.height : 0;

    canvas.width = w; // 大きさを変えると描画設定が初期化されるので、計測のあとで設定する
    canvas.height = thumb.height + band;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(thumb, 0, 0);
    if (block) block.draw(ctx, thumb.height);

    return {
      png: await canvasToBlob(canvas, 'image/png'),
      jpeg: await canvasToBlob(canvas, 'image/jpeg'),
      width: canvas.width,
      height: canvas.height,
      captioned: band > 0,
    };
  }

  // --- X の文字数カウント（全角 2・半角 1・URL 23） ----------------------
  function xWeightedLength(text) {
    let urls = 0;
    const rest = text.replace(/https?:\/\/[^\s]+/g, () => { urls++; return ''; });
    let n = urls * X_URL_WEIGHT;
    for (const ch of rest.normalize('NFC')) {
      const cp = ch.codePointAt(0);
      const light = cp <= 0x10ff || (cp >= 0x2000 && cp <= 0x200d) || (cp >= 0x2010 && cp <= 0x201f) || (cp >= 0x2032 && cp <= 0x2037);
      n += light ? 1 : 2;
    }
    return n;
  }

  function updateCount() {
    const n = xWeightedLength(textEl.value);
    countEl.textContent = n + ' / ' + X_LIMIT;
    countEl.classList.toggle('over', n > X_LIMIT);
  }

  // --- 生成 -------------------------------------------------------------
  // サービスごとの取得方法と投稿テキストの形
  const SERVICES = {
    youtube: {
      fetchInfo: (p) => fetchInfo(p.watchUrl),
      fetchThumb: (p) => fetchThumbnail(p.id),
      // 公式サムネイルのほかに選べる画像（動画の途中の場面 3 枚）
      // YouTube が公開している途中の場面はこの 3 枚だけ（4 枚目以降は存在しない）
      alternates: (p) => ['1', '2', '3'].map((n) => ({ label: '場面 ' + n, load: () => fetchThumbnail(p.id, n) })),
      hasInfo: (info) => !!info.title,
      lines: (info, p) => [info.title || '', '@YouTube', p.shareUrl],
      captionLabel: 'タイトル・チャンネル名',
      // 画像の下に、タイトル（少し大きめの太字）と、その下にチャンネル名（小さめ）を入れる
      caption: (info) => ({
        baseScale: 0.72,
        lineHeight: 1.12, // 文字どうしが重ならない範囲で行間を詰める
        padTop: 0.05, // 文字欄の上下の余白もほぼなくして、縦幅を小さくする
        padBottom: 0.08,
        rows: [
          { text: info.title, size: 1, bold: true, color: '#111111', maxLines: 2 },
          { text: info.channel, size: 0.76, color: '#666666' },
        ],
      }),
      missing: 'タイトルを取得できませんでした（非公開・削除済み・埋め込み不可の動画など）。1 行目に手入力してください。',
    },
    tver: {
      fetchInfo: (p) => fetchTverInfo(p.id),
      fetchThumb: (p) => fetchTverThumbnail(p.id),
      // TVer が公開している画像は、その回のサムネイルと番組全体の画像の 2 種類だけ
      alternates: (p, info) => (info.seriesID
        ? [{ label: '番組の画像', load: () => fetchTverThumbnail(info.seriesID, 'series') }]
        : []),
      hasInfo: (info) => !!(info.title || info.series),
      lines: (info, p) => {
        const head = [info.series, info.title].filter(Boolean);
        return [...(head.length ? head : ['', '']), '#TVer', p.shareUrl];
      },
      captionLabel: '番組名・タイトル・テレビ局・放送日',
      // TVer の番組ページと同じ並び：番組名（太字）/ タイトル（大きめの太字）/ テレビ局 / 放送日
      caption: (info) => ({
        lineHeight: 1.12, // 文字どうしが重ならない範囲で行間を詰める
        rows: [
          { text: info.series, size: 0.78, bold: true, color: '#111111', maxLines: 2 },
          { text: info.title, size: 1, bold: true, color: '#111111', maxLines: 2 },
          { text: info.provider, size: 0.74, color: '#666666', gapBefore: 0.12 },
          { text: info.date, size: 0.74, color: '#666666' },
        ],
      }),
      missing: '番組情報を取得できませんでした。番組名とタイトルを上の行に手入力してください。',
    },
  };

  // 投稿画像を設定する。source はサムネイルか、利用者が用意したスクショ（custom）
  // 戻り値: true=設定できた / false=失敗 / null=新しい描画に追い越されたので破棄
  async function renderImage(source, custom) {
    const target = current;
    const mySeq = ++renderSeq;
    target.source = source;
    target.custom = custom;
    const setting = captionSettings[target.parsed.service];
    captionToolsEl.hidden = false;
    let t = null;
    if (source) {
      try {
        const caption = setting.show ? target.service.caption(target.info) : null;
        t = await composeImage(source, caption, setting.size / 100);
      } catch { /* 下で「取得できませんでした」表示 */ }
    }
    // 別の動画に切り替わったか、設定変更で描き直しが始まっていたら破棄
    if (target !== current || mySeq !== renderSeq) return null;

    if (thumbObjectUrl) URL.revokeObjectURL(thumbObjectUrl);
    if (t) {
      const name = (custom ? 'screenshot_' : 'thumbnail_') + target.parsed.id + '.jpg';
      pngBlob = t.png;
      shareFile = new File([t.jpeg], name, { type: 'image/jpeg' });
      thumbObjectUrl = URL.createObjectURL(t.jpeg);
      thumbEl.src = thumbObjectUrl;
      thumbEl.hidden = false;
      const chosen = target.options[target.selected];
      const kind = custom ? 'スクショ画像' : (chosen && chosen.label !== 'サムネイル' ? (chosen.label.endsWith('画像') ? chosen.label : chosen.label + ' の画像') : 'サムネイル画像');
      thumbMetaEl.textContent = kind + ' ' + t.width + ' × ' + t.height +
        (t.captioned ? '（下に' + target.service.captionLabel + '入り）' : '');
      saveImageEl.href = thumbObjectUrl;
      saveImageEl.download = name;
      saveImageEl.hidden = false;
      copyImageBtn.disabled = false;
    } else {
      pngBlob = null;
      shareFile = null;
      thumbObjectUrl = '';
      thumbEl.hidden = true;
      saveImageEl.hidden = true;
      copyImageBtn.disabled = true;
      thumbMetaEl.textContent = custom ? '画像を読み込めませんでした。' : 'サムネイル画像を取得できませんでした。';
    }
    revertBtn.hidden = !(custom && t);
    updateChoiceUi();
    postBtn.textContent = pngBlob ? '画像をコピーして X の投稿画面を開く' : 'X の投稿画面を開く';
    updateShareUi();
    return !!t;
  }

  // --- 画像の候補（公式サムネイル＋途中の場面）から選ぶ ------------------
  function updateChoiceUi() {
    const buttons = choicesEl.querySelectorAll('button');
    buttons.forEach((btn, i) => {
      btn.setAttribute('aria-pressed', String(!!current && !current.custom && i === current.selected));
    });
  }

  function buildChoices(target) {
    choicesEl.textContent = '';
    choicesEl.hidden = target.options.length < 2;
    if (choicesEl.hidden) return;
    target.options.forEach((option, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice';
      const preview = document.createElement('canvas');
      preview.width = 240;
      preview.height = Math.round((240 * option.canvas.height) / option.canvas.width);
      preview.getContext('2d').drawImage(option.canvas, 0, 0, preview.width, preview.height);
      const label = document.createElement('span');
      label.textContent = option.label;
      btn.append(preview, label);
      btn.addEventListener('click', async () => {
        if (target !== current) return;
        target.selected = i;
        if (await renderImage(option.canvas, false)) setStatus(option.label + ' を投稿画像に設定しました。', 'ok');
      });
      choicesEl.appendChild(btn);
    });
    updateChoiceUi();
  }

  async function loadAlternates(target) {
    if (!target.service.alternates) return;
    const specs = target.service.alternates(target.parsed, target.info);
    if (!specs.length) return;
    const results = await Promise.allSettled(specs.map((s) => s.load()));
    if (target !== current) return;
    results.forEach((r, i) => {
      if (r.status === 'fulfilled') target.options.push({ label: specs[i].label, canvas: r.value });
    });
    buildChoices(target);
    // 公式サムネイルが取れなかった場合は、最初の候補を使う
    if (!target.source && target.options.length) {
      target.selected = 0;
      if (await renderImage(target.options[0].canvas, false)) setStatus('生成しました。', 'ok');
    }
  }

  // --- 自分で撮ったスクショを投稿画像にする -----------------------------
  const MAX_SIDE = 1920; // 大きすぎる画像は縮小する（コピーや共有を軽くするため）

  async function useCustomImage(blob) {
    if (!current || resultEl.hidden) {
      setStatus('先に YouTube か TVer の URL を貼り付けてください。そのあとでスクショを設定できます。', 'err');
      return;
    }
    const target = current;
    let canvas;
    try {
      const bmp = await createImageBitmap(blob);
      const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
      canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(bmp.width * scale));
      canvas.height = Math.max(1, Math.round(bmp.height * scale));
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
    } catch {
      setStatus('画像を読み込めませんでした。PNG か JPEG の画像を使ってください。', 'err');
      return;
    }
    if (target !== current) return;
    const ok = await renderImage(canvas, true);
    if (ok) setStatus('スクショを投稿画像に設定しました。', 'ok');
    else if (ok === false) setStatus('画像を読み込めませんでした。', 'err');
  }

  // --- 画像の下の帯の設定（YouTube と TVer で別々に保存する） -------------
  const CAPTION_KEY = 'yt-x-share.caption';
  const captionSettings = {};
  for (const key of Object.keys(SERVICES)) captionSettings[key] = { show: true, size: 100 };

  function readCaptionSetting(saved, into) {
    if (!saved || typeof saved !== 'object') return;
    into.show = saved.show !== false;
    const size = Number(saved.size);
    if (size >= Number(captionSizeEl.min) && size <= Number(captionSizeEl.max)) into.size = size;
  }

  try {
    const saved = JSON.parse(localStorage.getItem(CAPTION_KEY) || 'null');
    if (saved && 'show' in saved) {
      readCaptionSetting(saved, captionSettings.youtube); // 以前の形式（YouTube のみ）
    } else if (saved) {
      for (const key of Object.keys(captionSettings)) readCaptionSetting(saved[key], captionSettings[key]);
    }
  } catch { /* 既定値のまま */ }

  function saveCaptionSettings() {
    try {
      localStorage.setItem(CAPTION_KEY, JSON.stringify(captionSettings));
    } catch { /* 保存できなくても動作は続ける */ }
  }

  function updateCaptionControls() {
    captionSizeOutEl.textContent = captionSizeEl.value + '%';
    captionSizeEl.disabled = !captionShowEl.checked;
  }

  // 表示中のサービスの設定を、チェックボックスとスライダーに反映する
  function syncCaptionControls(serviceKey) {
    const setting = captionSettings[serviceKey];
    captionShowEl.checked = setting.show;
    captionSizeEl.value = String(setting.size);
    captionShowLabelEl.textContent = '画像の下に' + SERVICES[serviceKey].captionLabel + 'を入れる';
    updateCaptionControls();
  }

  let captionTimer = 0;
  function onCaptionChange() {
    updateCaptionControls();
    if (current) {
      const setting = captionSettings[current.parsed.service];
      setting.show = captionShowEl.checked;
      setting.size = Number(captionSizeEl.value);
    }
    saveCaptionSettings();
    clearTimeout(captionTimer);
    // スライダーを動かしている間に何度も描き直さないよう、少し待つ
    captionTimer = setTimeout(() => {
      if (current && !resultEl.hidden && current.source) renderImage(current.source, current.custom);
    }, 120);
  }
  captionShowEl.addEventListener('change', onCaptionChange);
  captionSizeEl.addEventListener('input', onCaptionChange);

  function firstImageFile(dataTransfer) {
    if (!dataTransfer) return null;
    for (const file of dataTransfer.files || []) {
      if (file.type.startsWith('image/')) return file;
    }
    for (const item of dataTransfer.items || []) {
      if (item.kind === 'file' && item.type.startsWith('image/')) return item.getAsFile();
    }
    return null;
  }

  async function generate(raw) {
    const parsed = parseUrl(raw);
    if (!parsed) {
      requestSeq++;
      lastKey = '';
      resultEl.hidden = true;
      if (String(raw).trim()) setStatus('YouTube か TVer の動画 URL として読み取れませんでした。', 'err');
      else setStatus('');
      return;
    }
    const service = SERVICES[parsed.service];
    if (parsed.shareUrl === lastKey) return;
    lastKey = parsed.shareUrl;

    const seq = ++requestSeq;
    setStatus('タイトルとサムネイルを取得中…');
    current = null;
    pngBlob = null;
    shareFile = null;
    copyImageBtn.disabled = true;
    resultEl.hidden = true; // 前の動画の内容を誤って投稿しないように隠す

    const [infoResult, thumbCanvasResult] = await Promise.allSettled([
      service.fetchInfo(parsed),
      service.fetchThumb(parsed),
    ]);
    if (seq !== requestSeq) return; // 新しい貼り付けが来ていたら破棄

    const info = infoResult.status === 'fulfilled' ? infoResult.value : {};
    const title = service.hasInfo(info);
    if (!title && thumbCanvasResult.status !== 'fulfilled') {
      lastKey = '';
      setStatus('動画が見つかりませんでした。URL を確認してください（ネットワーク未接続の場合も表示されます）。', 'err');
      return;
    }

    current = {
      parsed,
      info,
      service,
      // 選べる画像の一覧。先頭は公式サムネイル
      options: thumbCanvasResult.status === 'fulfilled' ? [{ label: 'サムネイル', canvas: thumbCanvasResult.value }] : [],
      selected: 0,
    };
    const target = current;
    syncCaptionControls(parsed.service);
    buildChoices(target);
    await renderImage(target.options.length ? target.options[0].canvas : null, false);
    if (seq !== requestSeq) return;
    textEl.value = service.lines(info, parsed).join('\n');
    updateCount();
    resultEl.hidden = false;
    loadAlternates(target); // 途中の場面は後から追加する（待たずに先へ進む）

    if (!title) {
      setStatus(service.missing, 'err');
      textEl.focus();
      textEl.setSelectionRange(0, 0);
    } else if (!pngBlob) {
      setStatus('テキストを生成しました（画像は取得できませんでした）。', 'err');
    } else {
      setStatus('生成しました。', 'ok');
    }
  }

  // --- スマホの共有メニュー（画像とテキストを X アプリへ直接渡す） --------
  function updateShareUi() {
    let canShareFile = false;
    try {
      canShareFile = !!shareFile && !!navigator.canShare && navigator.canShare({ files: [shareFile] });
    } catch { /* 非対応ブラウザ */ }
    const preferShare = canShareFile && isMobile;
    shareBtn.hidden = !canShareFile;
    shareBtn.classList.toggle('primary', preferShare);
    postBtn.classList.toggle('primary', !preferShare);
    hintMobileEl.hidden = !preferShare;
    hintDesktopEl.hidden = preferShare || !pngBlob;
  }

  shareBtn.addEventListener('click', async () => {
    if (!shareFile) return;
    const text = textEl.value;
    // 共有先のアプリがテキストを受け取らない場合に備えてコピーもしておく
    try { await navigator.clipboard.writeText(text); } catch { /* 共有は続行 */ }
    try {
      await navigator.share({ text, files: [shareFile] });
    } catch (e) {
      if (e && e.name !== 'AbortError') setStatus('共有できませんでした。「画像を保存」と「テキストをコピー」を使ってください。', 'err');
    }
  });

  // --- コピー / 投稿 -----------------------------------------------------
  async function copyImage() {
    if (!pngBlob) throw new Error('no image');
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
  }

  postBtn.addEventListener('click', async () => {
    let copied = false;
    if (pngBlob) {
      try { await copyImage(); copied = true; } catch { /* 下でメッセージ表示 */ }
    }
    const intent = 'https://x.com/intent/post?text=' + encodeURIComponent(textEl.value);
    window.open(intent, '_blank', 'noopener');
    if (copied) setStatus('画像をコピーしました。X の入力欄で Ctrl+V を押して添付してください。', 'ok');
    else if (pngBlob) setStatus('画像のコピーに失敗しました。「画像を保存」から添付してください。', 'err');
  });

  copyTextBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(textEl.value);
      setStatus('テキストをコピーしました。', 'ok');
    } catch {
      textEl.select();
      setStatus('コピーできませんでした。選択した状態なので Ctrl+C でコピーしてください。', 'err');
    }
  });

  copyImageBtn.addEventListener('click', async () => {
    try {
      await copyImage();
      setStatus('画像をコピーしました。', 'ok');
    } catch {
      setStatus('画像のコピーに失敗しました。「画像を保存」を使ってください。', 'err');
    }
  });

  textEl.addEventListener('input', updateCount);

  // ページのどこに貼り付けても反応する（投稿テキストの編集中は除く）
  document.addEventListener('paste', (e) => {
    // 画像が貼り付けられたら、スクショとして投稿画像に設定する
    const image = firstImageFile(e.clipboardData);
    if (image) {
      e.preventDefault();
      useCustomImage(image);
      return;
    }
    if (e.target === textEl) return;
    const pasted = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    if (!pasted.trim()) return;
    e.preventDefault();
    urlInput.value = pasted.trim();
    lastKey = '';
    generate(pasted);
  });

  // スクショをファイルから選ぶ（スマホではギャラリーが開く）
  pickImageBtn.addEventListener('click', () => pickImageInput.click());
  pickImageInput.addEventListener('change', () => {
    const file = pickImageInput.files && pickImageInput.files[0];
    pickImageInput.value = ''; // 同じ画像をもう一度選べるようにする
    if (file) useCustomImage(file);
  });
  revertBtn.addEventListener('click', async () => {
    if (!current) return;
    const chosen = current.options[current.selected];
    await renderImage(chosen ? chosen.canvas : null, false);
    setStatus('スクショをやめて、元の画像に戻しました。', 'ok');
  });
  if (isMobile) imageHintEl.hidden = true;

  // 画像ファイルのドラッグ＆ドロップ
  const hasFiles = (e) => !!e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  document.addEventListener('dragover', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    document.body.classList.add('dragging');
  });
  document.addEventListener('dragleave', (e) => {
    if (!e.relatedTarget) document.body.classList.remove('dragging');
  });
  document.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    document.body.classList.remove('dragging');
    const image = firstImageFile(e.dataTransfer);
    if (image) useCustomImage(image);
    else setStatus('画像ファイルをドロップしてください。', 'err');
  });

  // 手入力やドラッグ＆ドロップにも対応
  let debounce = 0;
  urlInput.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => generate(urlInput.value), 350);
  });
  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { clearTimeout(debounce); lastKey = ''; generate(urlInput.value); }
  });

  // スマホ向け：ボタンでクリップボードから貼り付け
  if (navigator.clipboard && navigator.clipboard.readText) {
    pasteBtn.hidden = false;
    pasteBtn.addEventListener('click', async () => {
      try {
        const pasted = (await navigator.clipboard.readText()).trim();
        if (!pasted) { setStatus('クリップボードにテキストがありません。', 'err'); return; }
        urlInput.value = pasted;
        lastKey = '';
        generate(pasted);
      } catch {
        setStatus('クリップボードを読み取れませんでした。入力欄に直接貼り付けてください。', 'err');
        urlInput.focus();
      }
    });
  }
  if (isMobile) urlInput.placeholder = 'YouTube / TVer の URL を貼り付け';

  // YouTube アプリの「共有」からこのアプリが選ばれたとき（?text= / ?url= で届く）
  const params = new URLSearchParams(location.search);
  const sharedKeys = ['url', 'text', 'title'];
  const sharedValues = sharedKeys.map((k) => (params.get(k) || '').trim()).filter(Boolean);
  if (sharedValues.length) {
    const shared = sharedValues.find((v) => parseUrl(v));
    history.replaceState(null, '', location.pathname);
    if (shared) {
      urlInput.value = parseUrl(shared).shareUrl;
      generate(shared);
    } else {
      // 原因を調べられるよう、受け取った内容をそのまま見せる
      const received = sharedValues.join(' ／ ');
      urlInput.value = received.slice(0, 500);
      setStatus('共有された内容から YouTube か TVer の動画 URL を読み取れませんでした。受け取った内容：' +
        received.slice(0, 300), 'err');
    }
  } else if (sharedKeys.some((k) => params.has(k))) {
    history.replaceState(null, '', location.pathname);
    setStatus('共有元のアプリからリンクが渡されませんでした。共有元で「リンクをコピー」してから「貼り付け」を押してください。', 'err');
  }

  // インストール可能なアプリ（PWA）として動かすための登録
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* 未対応でも本体は動く */ });
  }
})();
</script>
</body>
</html>
